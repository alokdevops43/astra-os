<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA | Galaxy Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Lora:ital,wght@0,400;0,500&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/galaxy-map.css">
</head>
<body>

    <div id="cinematic-stage">
        
        <!-- The interactive galaxy layer -->
        <canvas id="deep-galaxy-canvas"></canvas>
        
        <!-- UI Overlays -->
        <div class="map-overlay">
            <h1 class="tech-mono fade-up">SECTOR 4: ORION SPUR</h1>
            <div class="target-lock fade-up delay-1">
                <svg viewBox="0 0 100 100" class="lock-svg">
                    <path d="M10,30 L10,10 L30,10" fill="none" stroke="var(--brand-accent)" stroke-width="2"/>
                    <path d="M70,10 L90,10 L90,30" fill="none" stroke="var(--brand-accent)" stroke-width="2"/>
                    <path d="M90,70 L90,90 L70,90" fill="none" stroke="var(--brand-accent)" stroke-width="2"/>
                    <path d="M30,90 L10,90 L10,70" fill="none" stroke="var(--brand-accent)" stroke-width="2"/>
                    <circle cx="50" cy="50" r="2" fill="var(--brand-alert)"/>
                </svg>
                <div class="lock-info">
                    <div class="lbl">TRAPPIST-1</div>
                    <div class="val">39.6 LY DIST</div>
                </div>
            </div>
        </div>
        
    </div>

</body>
</html>
