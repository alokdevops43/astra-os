<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA | AI Core</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Lora:ital,wght@0,400;0,500&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/core.css">
    <link rel="stylesheet" href="css/ai-core.css">
</head>
<body>

    <div id="cinematic-stage">
        
        <div class="ai-environment">
            <!-- Neural Network background effect -->
            <div class="neural-bg"></div>

            <div class="ai-entity">
                <div class="core-glow"></div>
                <div class="voice-waves">
                    <div class="wave w1"></div>
                    <div class="wave w2"></div>
                    <div class="wave w3"></div>
                    <div class="wave w4"></div>
                    <div class="wave w5"></div>
                </div>
            </div>

            <div class="chat-interface">
                <div class="dialogue-box fade-up">
                    <p class="ai-text tech-mono" id="typewriter"></p>
                </div>
                <div class="input-zone fade-up delay-2">
                    <div class="input-indicator"></div>
                    <input type="text" placeholder="Awaiting Commander input..." class="fui-input" readonly>
                </div>
            </div>
        </div>

    </div>

    <nav class="global-hud">

        <a href="launch-center.html">08 LAUNCH</a>
    </nav>

    <script src="js/engine.js"></script>
    <script src="js/ai-core.js"></script>
</body>
</html>
